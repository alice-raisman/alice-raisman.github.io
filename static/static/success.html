<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALICE RAISMAN — Дань принята</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --gold:#b8973a; --gold2:#d4af5a; --black:#07060a; --text:#c8bfa8; --light:#ede4d0; }
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh;
    background: radial-gradient(ellipse 80% 60% at 50% 40%, rgba(184,151,58,0.09) 0%, transparent 70%), var(--black);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    text-align:center; padding:60px 24px;
    font-family:'Playfair Display', serif; color:var(--text);
  }
  .ornament { font-size:52px; color:var(--gold); opacity:.4; margin-bottom:32px; animation:fadeUp 1s ease forwards; }
  h1 { font-size:clamp(32px,7vw,68px); font-weight:900; font-style:italic; color:var(--light); line-height:1.1; margin-bottom:16px; animation:fadeUp 1s ease forwards 0.2s; opacity:0; }
  .sub { font-size:clamp(18px,3vw,26px); font-style:italic; color:var(--gold2); margin-bottom:40px; animation:fadeUp 1s ease forwards 0.4s; opacity:0; }
  .desc { max-width:480px; font-size:16px; line-height:2; color:rgba(200,191,168,0.6); animation:fadeUp 1s ease forwards 0.6s; opacity:0; }
  .back {
    margin-top:48px; display:inline-block;
    border:1px solid rgba(184,151,58,0.3); color:var(--gold);
    font-family:'Cinzel',serif; font-size:10px; letter-spacing:0.4em; text-transform:uppercase;
    padding:14px 40px; text-decoration:none;
    transition:all 0.3s; animation:fadeUp 1s ease forwards 0.8s; opacity:0;
  }
  .back:hover { background:rgba(184,151,58,0.08); border-color:var(--gold); }
  @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>
  <div class="ornament">✦</div>
  <h1>Добро пожаловать<br>в подчинение.</h1>
  <p class="sub">Твоя жизнь стала лучше.</p>
  <p class="desc">Ты сделал правильный шаг.<br>Дань принята. Алиса знает о тебе.<br>Это только начало твоего пути.</p>
  <a class="back" href="/">← ВЕРНУТЬСЯ</a>
</body>
</html>
